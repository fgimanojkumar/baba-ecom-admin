<div class="container-fluid px-3 px-lg-4 py-4">
    <!-- PAGE HEADING -->
    <div class="page-heading">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-flower1" aria-hidden="true"></i></span>
            <div>
                <h1 class="h5 mb-1">Categories</h1>
                <p class="text-muted mb-0">Manage your product categories.</p>
            </div>
        </div>
        <div class="heading-actions">
            <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#categoryModal">
                <i class="bi bi-plus-circle" aria-hidden="true"></i>
                Add New Category
            </button>
        </div>
    </div>

    <!-- CATEGORY LIST TABLE -->
    <section class="panel mt-3">
        <div class="panel-header">
            <h2 class="h5 mb-1 section-title"><i class="bi bi-table" aria-hidden="true"></i> Category List</h2>
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th scope="col">Category</th>
                        <th scope="col">Description</th>
                        <th scope="col">Product Count</th>
                        <th scope="col">Status</th>
                        <th scope="col" class="text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dummy Category Row 1 -->
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img class="avatar-img avatar-sm" src="assets/images/avatar/avatar-fallback.jpg"
                                    alt="Electronics">
                                <div>
                                    <p class="fw-semibold mb-0">Electronics</p>
                                </div>
                            </div>
                        </td>
                        <td>Gadgets and devices</td>
                        <td>150</td>
                        <td><span class="badge text-bg-success">Active</span></td>
                        <td class="text-end">
                            <div class="btn-group">
                                <button type="button" class="btn btn-info dropdown-toggle btn-sm"
                                    data-bs-toggle="dropdown" aria-expanded="false">Action</button>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" data-bs-toggle="modal"
                                            data-bs-target="#categoryModal">Edit</a></li>
                                    <li><a class="dropdown-item text-danger" href="#">Delete</a></li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                    <!-- Dummy Category Row 2 -->
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img class="avatar-img avatar-sm" src="assets/images/avatar/avatar-fallback.jpg"
                                    alt="Apparel">
                                <div>
                                    <p class="fw-semibold mb-0">Apparel</p>
                                </div>
                            </div>
                        </td>
                        <td>Clothing and fashion</td>
                        <td>320</td>
                        <td><span class="badge text-bg-success">Active</span></td>
                        <td class="text-end">
                            <div class="btn-group">
                                <button type="button" class="btn btn-info dropdown-toggle btn-sm"
                                    data-bs-toggle="dropdown" aria-expanded="false">Action</button>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" data-bs-toggle="modal"
                                            data-bs-target="#categoryModal">Edit</a></li>
                                    <li><a class="dropdown-item text-danger" href="#">Delete</a></li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- ADD/EDIT CATEGORY MODAL -->
    <div class="modal fade" id="categoryModal" aria-hidden="true" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form>
                    <div class="modal-header">
                        <h5 class="modal-title">Add/Edit Category</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Category Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category Image</label>
                            <input type="file" class="form-control">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
